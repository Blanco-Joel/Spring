spring.datasource.url=jdbc:sqlite:./target/library-integration-test.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

spring.jackson.default-property-inclusion=non_null

security.jwt-simple.issuer=library-test-auth
security.jwt-simple.secret=this-is-a-test-secret-key-with-at-least-32-bytes
security.jwt-simple.expiration-minutes=60

server.port=0

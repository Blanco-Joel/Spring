spring.application.name=library
spring.datasource.url=jdbc:sqlite:./src/main/resources/db/library.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jackson.default-property-inclusion=non_null

security.jwt-simple.issuer=library-demo-auth
security.jwt-simple.secret=this-is-a-demo-secret-key-with-at-least-32-bytes
security.jwt-simple.expiration-minutes=60

server.port=9081